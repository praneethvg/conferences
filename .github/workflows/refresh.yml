name: Refresh conferences

on:
  schedule:
    - cron: "15 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conference-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Test tracker
        run: npm test
      - name: Refresh rolling 12-month list
        run: npm run refresh
      - name: Commit updated conference list
        run: |
          git add -- CONFERENCES.md conference-cache.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh US AI and infrastructure conferences" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
